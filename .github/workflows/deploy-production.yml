name: Deploy Re:Claim to Production

on:
  push:
    branches: [ main ] 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Mark workspace as safe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory /app

      - name: Transfer package.json
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_RECLAIM_PRODUCTION }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: "/home/${{ secrets.SSH_USERNAME }}/public_html/reclaim"
          SOURCE: "./package.json"

      - name: Transfer composer.json
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_RECLAIM_PRODUCTION }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: "/home/${{ secrets.SSH_USERNAME }}/public_html/reclaim"
          SOURCE: "./composer.json"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Setup Composer and install dependencies
        uses: php-actions/composer@v6
        env:
          COMPOSER: "composer.json"
        with:
          php_version: '8.0'
          dev: no
          args: '--ignore-platform-reqs --optimize-autoloader'
          ssh_key: ${{ secrets.SSH_PRIVATE_KEY_RECLAIM_PRODUCTION }}
          ssh_pub: ${{ secrets.SSH_PUBLIC_KEY_RECLAIM_PRODUCTION }}
          ssh_host: ${{ secrets.SSH_HOST }}
          ssh_port: ${{ secrets.SSH_PORT }}
          working_dir: "/home/${{ secrets.SSH_USERNAME }}/public_html/reclaim"

      - name: Build Frontend
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install --omit=dev
            fi
          fi
          
      - name: Deploy Frontend
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_RECLAIM_PRODUCTION }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: "/home/${{ secrets.SSH_USERNAME }}/public_html/reclaim"
          SOURCE: "./public/"
          EXCLUDE: "/.git/, /.github/, /node_modules/"

      - name: Deploy Backend
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_RECLAIM_PRODUCTION }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: "/home/${{ secrets.SSH_USERNAME }}/public_html/reclaim"
          SOURCE: "./src"
          EXCLUDE: "/.git/, /.github/, /node_modules/"
